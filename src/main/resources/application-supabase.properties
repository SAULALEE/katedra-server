# Supabase PostgreSQL session pooler (credentials supplied by Doppler/environment)
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST}:${SUPABASE_DB_PORT:5432}/${SUPABASE_DB_NAME:postgres}?sslmode=require
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the application-side pool conservative because Supavisor also pools connections.
spring.datasource.hikari.maximum-pool-size=${SUPABASE_DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${SUPABASE_DB_POOL_MIN_IDLE:1}

spring.flyway.locations=classpath:db/migration-postgresql
spring.flyway.baseline-on-migrate=false
