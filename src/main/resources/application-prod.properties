# Generic PostgreSQL production profile. Supabase deployments should prefer
# SPRING_PROFILES_ACTIVE=supabase, which adds the Supabase pool settings.
spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_DB_USER}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=classpath:db/migration-postgresql
spring.flyway.baseline-on-migrate=false

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.root=WARN
logging.level.Katedra.Server=INFO
