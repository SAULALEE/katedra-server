# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# Overrides the dummy local-dev fallbacks in application.properties with
# placeholders that have NO default: if the env var is missing, Spring fails
# to start instead of silently running with a known dummy secret.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.root=WARN
logging.level.Katedra.Server=INFO

# Connection pool sized for a managed MySQL free tier (Aiven/Clever Cloud), which caps total
# connections low and closes idle ones on its own wait_timeout. Hikari's defaults (10 connections,
# a 30-minute max-lifetime) hand out sockets the server already hung up on, surfacing as a
# CommunicationsException on the first request after a quiet spell. max-lifetime must stay below
# the provider's wait_timeout — check the real value in their console before raising it.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=240000
