# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# Overrides the dummy local-dev fallbacks in application.properties with
# placeholders that have NO default: if the env var is missing, Spring fails
# to start instead of silently running with a known dummy secret.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

logging.level.root=WARN
logging.level.Katedra.Server=INFO
