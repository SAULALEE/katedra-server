oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}

# Stripe (lee de Doppler). Los defaults vacíos son obligatorios: sin ellos el
# contexto de Spring no arranca en los tests ni en un checkout limpio sin Doppler.
# El precio se define en el dashboard de Stripe, nunca en código: así una promoción
# no requiere un despliegue.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price.pro-mensual=${STRIPE_PRICE_PRO_MENSUAL:}
stripe.price.pro-anual=${STRIPE_PRICE_PRO_ANUAL:}

logging.level.root=INFO

# Expose ResponseStatusException reason text (e.g. "Genera la teoría primero...") in the
# error JSON body. These messages are always hand-written, user-safe validation text — never
# raw exception details — so this is safe; include-stacktrace stays at its default (never).
server.error.include-message=always

# OpenAI / Spring AI
# No default chat.options here: AiContentGeneratorService sets a complete,
# tier-specific OpenAiChatOptions (model, temperature/maxTokens or
# reasoningEffort/maxCompletionTokens) on every call. A global default here
# would still get merged in for any option that call doesn't set, which is how
# temperature/max_tokens previously leaked into reasoning-model requests
# (gpt-5.4, o4-mini) that explicitly reject those parameters.
spring.ai.openai.api-key=${OPENAI_API_KEY:}

# Reasoning-tier generations (Catedrático) routinely take 30-90+
# seconds. Spring MVC's default async request timeout is 30s, which was
# silently returning 503 (AsyncRequestTimeoutException) before the AI call
# even finished. 3 minutes covers the slowest tier with margin.
spring.mvc.async.request-timeout=180000

# Async executor for AI generation
spring.task.execution.thread-name-prefix=ai-
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
