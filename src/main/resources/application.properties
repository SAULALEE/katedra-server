server.port=8080
server.servlet.context-path=/api/v1

# Database (lee de Doppler)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/katedra_dev}
spring.datasource.username=${DB_USER:katedra_dev}
spring.datasource.password=${DB_PASSWORD:ppXUPJYE31LGeB4IrsTCDtl/rTZ6CWbhu9n7/j7jZ0s=}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (lee de Doppler)
jwt.secret=${JWT_SECRET:dummysecretforlocaltestingonlypleasedonotuse1234}
jwt.expiration=${JWT_EXPIRATION:3600000}

app.frontend.oauth.success-url=${FRONTEND_OAUTH_SUCCESS_URL:}
app.frontend.oauth.error-url=${FRONTEND_OAUTH_ERROR_URL:}

oauth.google.client-id=
oauth.google.client-secret=

oauth.microsoft.client-id=${MICROSOFT_CLIENT_ID:}
oauth.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}

logging.level.root=INFO

# OpenAI / Spring AI
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=4096

# Async executor for AI generation
spring.task.execution.thread-name-prefix=ai-
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
