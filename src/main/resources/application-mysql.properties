# MySQL datasource (credentials supplied by Doppler/environment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/katedra_dev}
spring.datasource.username=${DB_USER:katedra_dev}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.locations=classpath:db/migration
