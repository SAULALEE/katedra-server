spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false

jwt.secret=dummysecretforlocaltestingonlypleasedonotuse1234
jwt.expiration=3600000

app.frontend.oauth.success-url=http://localhost:3000/auth/callback
app.frontend.oauth.error-url=http://localhost:3000/auth/error

spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.microsoft.client-id=test-microsoft-client-id
spring.security.oauth2.client.registration.microsoft.client-secret=test-microsoft-client-secret
spring.security.oauth2.client.registration.microsoft.client-name=Microsoft
spring.security.oauth2.client.registration.microsoft.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.microsoft.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
