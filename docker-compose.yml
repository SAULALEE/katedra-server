# Local Katedra stack: MySQL + the API.
#
#   ./scripts/local-stack.sh up      # Doppler local -> database + API
#                                    # http://localhost:8080/api/v1
#
# To run only the database and start the API from your IDE or ./mvnw instead:
#
#   doppler run --project katedra-server --config local -- docker compose up -d mysql
#
# This file intentionally has no fallback credentials. Always invoke Compose through
# Doppler's `local` configuration.

services:
  mysql:
    image: mysql:8.0
    container_name: katedra_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be provided by Doppler}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be provided by Doppler}
      MYSQL_USER: ${DB_USER:?DB_USER must be provided by Doppler}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided by Doppler}
    ports:
      - "3306:3306"
    volumes:
      - katedra_data:/var/lib/mysql
    networks:
      - katedra_network
    healthcheck:
      # The API's depends_on waits on this, so it must prove the server accepts
      # authenticated connections, not merely that the process is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be provided by Doppler}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build: .
    container_name: katedra_server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be provided by Doppler}
      # Host is `mysql`, not localhost: inside the compose network the database is
      # reached by service name. This is why DB_URL is set here rather than inherited
      # from a local file.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE must be provided by Doppler}
      DB_USER: ${DB_USER:?DB_USER must be provided by Doppler}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided by Doppler}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided by Doppler}
      JWT_EXPIRATION: ${JWT_EXPIRATION:?JWT_EXPIRATION must be provided by Doppler}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be provided by Doppler}

      # Required for content generation. Unset means the app runs but every
      # generation request fails.
      OPENAI_API_KEY: ${OPENAI_API_KEY-}

      # Optional. Unset disables social sign-in; the app still starts cleanly.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET-}
      FRONTEND_OAUTH_SUCCESS_URL: ${FRONTEND_OAUTH_SUCCESS_URL-}
      FRONTEND_OAUTH_ERROR_URL: ${FRONTEND_OAUTH_ERROR_URL-}

      # Optional for the app as a whole (unset means billing is inert and every
      # account stays on Free), but GET /suscripciones/planes calls Stripe
      # unconditionally and 500s without these — that includes the landing
      # page's public pricing table.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET-}
      STRIPE_PRICE_PRO_MENSUAL: ${STRIPE_PRICE_PRO_MENSUAL-}
      STRIPE_PRICE_PRO_ANUAL: ${STRIPE_PRICE_PRO_ANUAL-}
    ports:
      - "${PORT:?PORT must be provided by Doppler}:8080"
    networks:
      - katedra_network

networks:
  katedra_network:
    driver: bridge

volumes:
  katedra_data:
