# Local Katedra stack: PostgreSQL + the API.
#
#   ./scripts/local-stack.sh up      # Doppler local -> database + API
#                                    # http://localhost:8080/api/v1
#
# To run only the database and start the API from your IDE or ./mvnw instead:
#
#   doppler run --project katedra-server --config local -- docker compose up -d postgres
#
# This file intentionally has no fallback credentials. Always invoke Compose through
# Doppler's `local` configuration.

services:
  postgres:
    image: postgres:17-alpine
    container_name: katedra_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB_NAME:?POSTGRES_DB_NAME must be provided by Doppler}
      POSTGRES_USER: ${POSTGRES_DB_USER:?POSTGRES_DB_USER must be provided by Doppler}
      POSTGRES_PASSWORD: ${POSTGRES_DB_PASSWORD:?POSTGRES_DB_PASSWORD must be provided by Doppler}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - katedra_postgres_data:/var/lib/postgresql/data
    networks:
      - katedra_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build: .
    container_name: katedra_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-postgresql}
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME:?POSTGRES_DB_NAME must be provided by Doppler}
      POSTGRES_DB_USER: ${POSTGRES_DB_USER:?POSTGRES_DB_USER must be provided by Doppler}
      POSTGRES_DB_PASSWORD: ${POSTGRES_DB_PASSWORD:?POSTGRES_DB_PASSWORD must be provided by Doppler}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided by Doppler}
      JWT_EXPIRATION: ${JWT_EXPIRATION:?JWT_EXPIRATION must be provided by Doppler}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be provided by Doppler}

      # Required for content generation. Unset means the app runs but every
      # generation request fails.
      OPENAI_API_KEY: ${OPENAI_API_KEY-}

      # Optional. Unset disables social sign-in; the app still starts cleanly.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET-}
      FRONTEND_OAUTH_SUCCESS_URL: ${FRONTEND_OAUTH_SUCCESS_URL-}
      FRONTEND_OAUTH_ERROR_URL: ${FRONTEND_OAUTH_ERROR_URL-}

      # Optional for the app as a whole (unset means billing is inert and every
      # account stays on Free), but GET /suscripciones/planes calls Stripe
      # unconditionally and 500s without these — that includes the landing
      # page's public pricing table.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET-}
      STRIPE_PRICE_PRO_MENSUAL: ${STRIPE_PRICE_PRO_MENSUAL-}
      STRIPE_PRICE_PRO_ANUAL: ${STRIPE_PRICE_PRO_ANUAL-}
    ports:
      - "${PORT:?PORT must be provided by Doppler}:8080"
    networks:
      - katedra_network

networks:
  katedra_network:
    driver: bridge

volumes:
  katedra_postgres_data:
